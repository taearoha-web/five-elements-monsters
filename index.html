<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06151f"><title>Five Elements Monsters V0.3 — 1v1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#041018;color:white;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
body{min-height:100dvh}.app{max-width:820px;margin:auto;min-height:100dvh;background:linear-gradient(#0b2b3b,#06131d)}
.screen{display:none;min-height:100dvh;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-weight:1000;font-size:18px}.logo b{color:#ffd15b}.pill{background:#06131ddd;border:1px solid #ffffff28;border-radius:999px;padding:7px 10px;font-size:12px}
h1{font-size:34px;line-height:1.05;margin:22px 0 6px;text-align:center}.lead{text-align:center;opacity:.75;margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.card{background:linear-gradient(160deg,#ffffff16,#ffffff07);border:1px solid #ffffff28;border-radius:18px;padding:7px;text-align:center;overflow:hidden}
.card img{width:100%;height:145px;object-fit:contain;filter:drop-shadow(0 8px 5px #0008)}.card b{display:block;font-size:13px}.muted{font-size:10px;opacity:.7}.pick,.btn{border:1px solid #ffffff30;border-radius:12px;background:linear-gradient(#f4d36d,#bd8120);color:#171006;font-weight:900;padding:10px}.pick{width:100%;margin-top:7px}
.world{height:62dvh;min-height:450px;position:relative;overflow:hidden;border:1px solid #ffffff2c;border-radius:22px;background:linear-gradient(90deg,transparent 43%,#d5b36e 43% 58%,transparent 58%),linear-gradient(#47a65b,#65b565)}
.river{position:absolute;right:0;width:23%;height:100%;background:repeating-linear-gradient(165deg,#52c7db 0 9px,#42aabf 9px 18px);border-left:7px solid #d8c37a}.house{position:absolute;left:4%;top:8%;font-size:92px}.tree{position:absolute;font-size:52px}.t1{left:5%;bottom:7%}.t2{left:26%;top:24%}.t3{right:25%;bottom:8%}.t4{right:25%;top:9%}
.quest{position:absolute;z-index:9;left:9px;top:9px;background:#06131de8;border:1px solid #ffffff25;border-radius:12px;padding:8px;font-size:11px;max-width:58%}
.actor{position:absolute;z-index:5;transition:.14s}.actor img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 7px 4px #0008)}#buddy img{width:72px;height:72px}
.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px}.dpad{display:grid;grid-template-columns:repeat(3,50px);gap:4px}.dpad button{height:45px;border:1px solid #ffffff2c;border-radius:13px;background:#123346;color:#fff;font-size:18px}.u{grid-column:2}.l{grid-column:1}.d{grid-column:2}.r{grid-column:3}
.panel{margin-top:8px;background:#0b2230;border:1px solid #ffffff25;border-radius:16px;padding:10px}.buddyline{display:flex;align-items:center;gap:9px}.buddyline img{width:58px;height:58px;object-fit:contain}
.battle{height:58dvh;min-height:440px;position:relative;overflow:hidden;border-radius:22px;border:1px solid #ffffff2a;background:linear-gradient(#285d6e 0 33%,#78aa64 33% 50%,#9b784d 50%)}
.battle:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 72% 34%,#d5d9a0 0 16%,transparent 17%),radial-gradient(ellipse at 28% 74%,#c9c28b 0 19%,transparent 20%)}
.enemy,.ally{position:absolute;z-index:3}.enemy{right:7%;top:8%;width:43%;text-align:center}.ally{left:5%;bottom:5%;width:48%}.enemy img,.ally img{width:100%;height:190px;object-fit:contain;filter:drop-shadow(0 10px 6px #0009)}.ally img{height:220px}
.name{display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 3px #000}.hp{height:10px;background:#4b2731;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#5fe072;transition:.2s}
.turn{text-align:center;margin:7px 0;font-weight:1000}.cmd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cmd button{border:1px solid #ffffff2b;border-radius:12px;background:#102c3e;color:#fff;font-weight:800;padding:11px 4px}.cmd button:first-child{background:linear-gradient(#f4d46f,#b77a1b);color:#181005}
.log{height:70px;overflow:auto;margin-top:7px;background:#0004;border-radius:10px;padding:8px;font-size:11px;line-height:1.45}
@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.card:last-child{grid-column:1/-1}.card img{height:130px}.world{height:57dvh}.battle{height:55dvh}.enemy img{height:145px}.ally img{height:170px}}
</style></head><body><main class="app">
<section id="select" class="screen on"><div class="top"><div class="logo">FIVE ELEMENTS <b>MONSTERS</b></div><span class="pill">V0.3 • 1 VS 1</span></div>
<h1>เลือกมอนสเตอร์<br><span style="color:#ffd15b">คู่ใจ</span></h1><div class="lead">เริ่มการผจญภัยด้วยมอนสเตอร์ 1 ใน 5 ธาตุ</div><div id="cards" class="cards"></div></section>
<section id="worldS" class="screen"><div class="top"><div class="logo">🌿 หมู่บ้านสายลม</div><span class="pill">⭐ Lv.<span id="lv">1</span> • EXP <span id="xp">0</span>/100</span></div>
<div class="world"><div class="quest">📜 <b>เควสหลัก</b><br>ออกจากหมู่บ้านไปยังป่าแห่งการเริ่มต้น</div><div class="river"></div><div class="house">🏠</div><div class="tree t1">🌳</div><div class="tree t2">🌲</div><div class="tree t3">🌳</div><div class="tree t4">🌲</div><div id="buddy" class="actor"></div><div id="player" class="actor"><img src="assets/player.png"></div></div>
<div class="controls"><div class="dpad"><button class="u" data-x="0" data-y="-1">▲</button><button class="l" data-x="-1" data-y="0">◀</button><button class="d" data-x="0" data-y="1">▼</button><button class="r" data-x="1" data-y="0">▶</button></div><button class="btn" id="fight">⚔️ ต่อสู้ 1 VS 1</button></div>
<div class="panel"><div id="buddyInfo" class="buddyline"></div></div></section>
<section id="battleS" class="screen"><div class="top"><div class="logo">⚔️ การต่อสู้ <b>1 VS 1</b></div><span id="turn" class="pill">TURN 1</span></div>
<div class="battle"><div id="enemy" class="enemy"></div><div id="ally" class="ally"></div></div>
<div class="panel"><div class="cmd"><button onclick="attack()">⚔️<br>โจมตี</button><button onclick="skill()">🔥<br>สกิล</button><button onclick="item()">🎒<br>ไอเทม</button><button onclick="run()">🏃<br>หนี</button></div><div id="log" class="log"></div></div></section>
</main><script>
const M=[{n:'กระทิงดิน',e:'Terrabull',el:'ดิน',img:'assets/earth.png',skill:'แผ่นดินสะเทือน'},{n:'ฉลามวารี',e:'Aquadon',el:'น้ำ',img:'assets/water.png',skill:'คลื่นมหาสมุทร'},{n:'วานรพายุ',e:'Skykong',el:'ลม',img:'assets/wind.png',skill:'พายุหมุน'},{n:'เม่นเพลิง',e:'Flarehog',el:'ไฟ',img:'assets/fire.png',skill:'หนามเพลิง'},{n:'คริสตัลทอง',e:'Aurumon',el:'ทอง',img:'assets/gold.png',skill:'ประกายพิฆาต'}];
let buddy,enemy,lv=1,xp=0,turn=1,px=48,py=55,bx=41,by=63;const $=x=>document.getElementById(x);
$('cards').innerHTML=M.map((m,i)=>`<div class=card><img src="${m.img}"><b>${m.n}</b><div class=muted>${m.e} • ธาตุ${m.el}</div><button class=pick onclick="choose(${i})">เลือก</button></div>`).join('');
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
window.choose=i=>{buddy={...M[i],hp:100,max:100};$('buddy').innerHTML=`<img src="${buddy.img}">`;$('buddyInfo').innerHTML=`<img src="${buddy.img}"><div><b>${buddy.n}</b><div class=muted>${buddy.e} • ธาตุ${buddy.el} • HP ${buddy.hp}/${buddy.max}</div></div>`;place();show('worldS')}
function place(){$('player').style.left=px+'%';$('player').style.top=py+'%';$('buddy').style.left=bx+'%';$('buddy').style.top=by+'%'}
document.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>{bx=px;by=py;px=Math.max(3,Math.min(77,px+(+b.dataset.x*4)));py=Math.max(14,Math.min(82,py+(+b.dataset.y*4)));place();if(Math.random()<.08)startBattle()});
$('fight').onclick=startBattle;
function startBattle(){let pool=M.filter(x=>x.e!==buddy.e);enemy={...pool[Math.floor(Math.random()*pool.length)],hp:42,max:42};buddy.hp=68;buddy.max=68;turn=1;render();$('log').innerHTML=`👾 ${enemy.n} ปรากฏตัว!<br>`;show('battleS')}
function box(m,who){let pct=Math.max(0,m.hp/m.max*100);return `<div class=name><span>${m.n}</span><span>Lv.${who==='enemy'?3:lv}</span></div><div class=hp><i style="width:${pct}%"></i></div><div style="font-size:11px;text-align:right">HP ${m.hp}/${m.max}</div><img src="${m.img}">`}
function render(){$('enemy').innerHTML=box(enemy,'enemy');$('ally').innerHTML=box(buddy,'ally');$('turn').textContent='TURN '+turn}
function lg(s){$('log').innerHTML+=s+'<br>';$('log').scrollTop=9999}
function hit(d){enemy.hp=Math.max(0,enemy.hp-d);lg(`${buddy.n} โจมตี! ${d} DMG`);if(enemy.hp<=0)return win();counter()}
window.attack=()=>{hit(8+Math.floor(Math.random()*8));render()}
window.skill=()=>{let d=15+Math.floor(Math.random()*10);lg(`✨ ใช้ ${buddy.skill}!`);hit(d);render()}
window.item=()=>{buddy.hp=Math.min(buddy.max,buddy.hp+18);lg('🎒 ใช้ยาฟื้นฟู +18 HP');counter();render()}
window.run=()=>{lg('🏃 หนีจากการต่อสู้สำเร็จ');setTimeout(()=>show('worldS'),450)}
function counter(){if(enemy.hp<=0)return;let d=4+Math.floor(Math.random()*7);buddy.hp=Math.max(0,buddy.hp-d);lg(`${enemy.n} โต้กลับ ${d} DMG`);turn++;if(buddy.hp<=0){lg('💫 คู่หูหมดแรง... กลับหมู่บ้าน');setTimeout(()=>show('worldS'),700)}}
function win(){xp+=50;lg('🏆 ชนะ! ได้รับ 50 EXP');if(xp>=100){xp-=100;lv++;lg('⭐ LEVEL UP! Lv.'+lv)}$('lv').textContent=lv;$('xp').textContent=xp;setTimeout(()=>show('worldS'),900)}
</script></body></html>
